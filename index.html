<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f2e6">
<title>每日一题 · 一年级上册</title>
<style>
:root{
  --paper:#fbf7ee; --paper2:#f3ecdc; --ink:#2b2822; --ink2:#544e44;
  --muted:#8a8172; --rule:#ddd1b8; --accent:#b8542f; --green:#4a7c59;
  --serif:"Songti SC","STSong","SimSun",serif;
  --sans:"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:#efe9db; color:var(--ink); font-family:var(--sans);
  font-size:17px; line-height:1.75; padding:14px 12px 40px;
  min-height:100vh;
}
.wrap{max-width:600px;margin:0 auto}

/* 顶部 */
.top{text-align:center;padding:8px 0 16px}
.top h1{
  margin:0;font-family:var(--serif);font-size:22px;letter-spacing:.16em;font-weight:600;
}
.top .sub{font-size:11.5px;letter-spacing:.22em;color:var(--muted);margin-top:6px}
.meta{
  display:flex;justify-content:center;gap:14px;margin-top:12px;
  font-size:12.5px;color:var(--muted);letter-spacing:.06em;flex-wrap:wrap;
}
.meta b{color:var(--accent);font-weight:600}

/* 卡片 */
.card{
  background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:20px 18px 18px;box-shadow:0 1px 2px rgba(80,60,30,.05),0 12px 30px -24px rgba(80,60,30,.5);
  position:relative;
}
.tag{
  display:inline-block;font-size:11px;letter-spacing:.16em;color:var(--accent);
  border:1px solid #e0c3b2;background:#fdf3ec;padding:2px 8px;border-radius:2px;
}
.lv{font-size:11px;color:var(--accent);letter-spacing:3px;margin-left:9px;vertical-align:2px}
.hard{display:inline-block;font-size:9.5px;letter-spacing:.14em;background:var(--accent);color:#fff;padding:1px 6px;border-radius:2px;margin-left:7px;vertical-align:2px}
.q{
  font-family:var(--serif);font-size:21px;line-height:2;margin:14px 0 4px;
  letter-spacing:.02em;white-space:pre-wrap;
}
.q em{font-style:normal;color:var(--accent);font-weight:600}
.acts{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
button{
  font-family:inherit;font-size:15px;padding:11px 20px;border-radius:3px;cursor:pointer;
  border:1px solid var(--ink);background:transparent;color:var(--ink);
  transition:background .18s,color .18s,transform .1s;flex:1 1 auto;min-width:120px;
}
button:active{transform:scale(.98)}
button.primary{background:var(--ink);color:var(--paper)}
button.ghost{border-color:var(--rule);color:var(--ink2)}
.panel{
  margin-top:16px;padding:14px 16px;border-radius:3px;font-size:15.5px;line-height:1.95;
  animation:slide .25s ease both;
}
@keyframes slide{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.panel.hint{background:var(--paper2);border-left:3px solid var(--rule);color:var(--ink2)}
.panel.answer{background:#f2f7f0;border-left:3px solid var(--green);color:#26402f}
.panel .lbl{font-size:11px;letter-spacing:.2em;color:var(--muted);display:block;margin-bottom:4px}
.panel .big{font-size:19px;font-weight:600;color:var(--green)}
.hidden{display:none}

/* 家长讲解 */
details.why{
  margin-top:18px;border-top:1px dashed var(--rule);padding-top:14px;
}
details.why summary{
  cursor:pointer;font-size:13px;letter-spacing:.1em;color:var(--muted);list-style:none;
  display:flex;align-items:center;gap:8px;
}
details.why summary::-webkit-details-marker{display:none}
details.why summary::before{content:"▸";font-size:11px;transition:transform .2s}
details.why[open] summary::before{transform:rotate(90deg)}
details.why .body{margin-top:10px;font-size:15px;line-height:1.95;color:var(--ink2)}
details.why .body p{margin:0 0 8px}

/* 往期 */
.past{margin-top:30px}
.past h2{
  font-size:12px;letter-spacing:.26em;color:var(--muted);font-weight:400;
  border-bottom:1px solid var(--rule);padding-bottom:8px;margin:0 0 4px;
}
details.item{border-bottom:1px solid #e8dec8}
details.item>summary{
  cursor:pointer;list-style:none;padding:13px 2px;display:flex;gap:10px;align-items:baseline;
}
details.item>summary::-webkit-details-marker{display:none}
details.item .no{font-size:11px;color:var(--muted);min-width:34px;font-variant-numeric:tabular-nums}
details.item .txt{flex:1;font-size:15px;line-height:1.6;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.item .date{font-size:11px;color:var(--muted);min-width:48px;text-align:right}
details.item .inner{padding:2px 2px 16px 46px;font-size:15px;line-height:1.95;color:var(--ink2)}
details.item .inner .a{color:var(--green);font-weight:600}
details.item .inner .lbl{font-size:11px;letter-spacing:.18em;color:var(--muted);display:block;margin:10px 0 2px}

.foot{text-align:center;font-size:11.5px;color:var(--muted);margin-top:34px;line-height:2}
.empty{padding:26px 4px;color:var(--muted);font-size:14px}

.all{margin-top:34px;border-top:1px solid var(--rule);padding-top:6px}
.all>summary{cursor:pointer;list-style:none;font-size:12px;letter-spacing:.22em;color:var(--muted);padding:12px 2px}
.all>summary::-webkit-details-marker{display:none}
.all>summary::before{content:"▸";font-size:10px;margin-right:7px;display:inline-block;transition:transform .2s}
.all[open]>summary::before{transform:rotate(90deg)}
.all__hint{font-size:11.5px;color:var(--muted);margin:0 0 6px 2px;line-height:1.8}
.allitem.future .txt,.allitem.future .no,.allitem.future .date{color:#a49b8b}
.allitem.today{background:#fdf7ee}
.allitem.today .no::after{content:" · 今天";color:var(--accent);letter-spacing:0}
.printbtn{margin:10px 0 4px;font-size:12px;padding:8px 14px;border:1px solid var(--rule);background:transparent;color:var(--ink2);border-radius:3px;cursor:pointer}
@media print{
  .past{display:none!important}
  .all>summary{display:none}
  details.allitem{border-bottom:1px solid #ddd;page-break-inside:avoid}
  details.allitem .inner{display:block!important}
}
@media (max-width:380px){
  .q{font-size:19px}
  button{font-size:14px;padding:10px 14px}
}
@media print{
  body{background:#fff;padding:0}
  .acts,.top .sub,.past,.foot{display:none!important}
  .card{border:0;box-shadow:none;padding:0}
  .panel{background:#fff;border-left:0;border-top:1px solid #ccc}
  details.why{display:block}
  details.why .body{display:block}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>每日一题</h1>
    <div class="sub">苏教版 · 一年级上册 · 奥数思维每日一题</div>
    <div class="meta">
      <span id="m-date">—</span>
      <span>第 <b id="m-day">—</b> 天</span>
      <span id="m-tag"></span>
    </div>
  </div>

  <div class="card" id="card"></div>

  <div class="past">
    <h2>往 期</h2>
    <div id="past"></div>
  </div>

  <details class="all" id="all-box">
    <summary>全部题目 · 家长预览</summary>
    <p class="all__hint">共 <b id="all-count">0</b> 道，含尚未到日期的题目（灰显）。点开任意一条可看题目、答案与讲解。</p>
    <button class="printbtn" type="button" id="print-all">打印全部题目</button>
    <div id="all-list"></div>
  </details>

  <div class="foot">难度递进 · 先画图，再找规律，最后才列式。<br>答案默认收起，先让孩子自己画一画、说一说。</div>
</div>

<script>
/* ============================================================
   题单：按顺序排，每天自动推一道（跳过周六周日）
   加题只需往 QS 末尾追加，日期会自动顺延
   ============================================================ */
var START = new Date(2026, 10, 17);   // 2026-11-17（周一）起算

var QS = [
{ lv:2, tag:"间隔 · 楼梯", q:"小明从 1 楼走到 3 楼用了 2 分钟。\n照这样算，他从 1 楼走到 6 楼\n要用几分钟？",
    hint:"1 楼到 3 楼，其实只走了几层楼梯？先算每层要几分钟。",
    a:"5 分钟", why:"1 楼到 3 楼走了 2 层，用 2 分钟，所以每层 1 分钟。1 楼到 6 楼要走 5 层，就是 5 分钟。关键：楼层数比楼梯层数多 1。" },

{ lv:1, tag:"图形算式", q:"两个 ○ 相加等于 8。○ 代表几？",
    hint:"想一想：几加几等于 8，两个数要一样。",
    a:"○ = 4", why:"4+4=8，所以 ○ 代表 4。",
    svg:'<svg viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><circle cx="70" cy="55" r="22" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="112" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><circle cx="154" cy="55" r="22" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="196" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">=</text><text x="232" y="66" font-size="30" text-anchor="middle" fill="#C25A3A" font-weight="700" font-family="inherit">8</text></svg>' },

{ lv:3, tag:"还原 · 一半", q:"妈妈买了一些糖。\n第一天吃掉一半，\n第二天吃掉剩下的一半，\n最后还剩 3 颗。\n原来有多少颗？",
    hint:"倒着推：最后剩 3 颗，那第二天吃之前有几颗？",
    a:"12 颗", why:"倒推：剩 3 颗 → 第二天吃之前是 3×2=6 颗 → 第一天吃之前是 6×2=12 颗。凡是“吃了一半”，就用乘 2 往回推。" },

{ lv:1, tag:"图形算式", q:"○ 代表 3。○ + ○ = △，△ 代表几？",
    hint:"两个 3 加起来是多少？",
    a:"△ = 6", why:"3+3=6。同样的图形表示同样的数。",
    svg:'<svg viewBox="0 0 340 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><circle cx="60" cy="55" r="22" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="100" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><circle cx="140" cy="55" r="22" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="180" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">=</text><path d="M225 29 L247 68 L202 68 Z" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="280" y="66" font-size="18" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">○=3</text></svg>' },

{ lv:2, tag:"排队 · 三次计数", q:"一队小朋友排队。\n小明从前数排第 5，\n从后数排第 6。\n这一队一共有多少人？",
    hint:"小明被数了两次，要减掉多算的那个“1”。",
    a:"10 人", why:"5 + 6 - 1 = 10。前面 4 人 + 小明自己 + 后面 5 人 = 10 人。让孩子画一排圆圈验证，一眼就看懂为什么要减 1。" },

{ lv:2, tag:"图形算式", q:"三个 □ 加起来等于 6。□ + ○ = 5。□ 和 ○ 各是几？",
    hint:"先想：哪三个一样的数加起来是 6？",
    a:"□ = 2，○ = 3", why:"2+2+2=6，所以 □ 是 2；2+3=5，所以 ○ 是 3。",
    svg:'<svg viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><rect x="28" y="33" width="44" height="44" rx="3" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="95" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><rect x="118" y="33" width="44" height="44" rx="3" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="185" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><rect x="208" y="33" width="44" height="44" rx="3" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="275" y="66" font-size="24" text-anchor="middle" fill="#C25A3A" font-weight="700" font-family="inherit">=6</text></svg>' },

{ lv:2, tag:"图形计数", q:"一条直线上有 4 个点。\n以这些点为端点，\n一共能数出多少条线段？",
    hint:"从左往右，先数相邻的，再数隔一个的，最后数隔两个的。",
    a:"6 条", why:"相邻 3 条 + 隔 1 个点的 2 条 + 隔 2 个点的 1 条 = 3+2+1=6 条。按顺序数，才不会重复或遗漏。" },

{ lv:3, tag:"图形算式", q:"△ + ○ = 8，△ − ○ = 2。△ 和 ○ 各是几？",
    hint:"两个数加起来 8，相差 2，它们应该挨得很近。",
    a:"△ = 5，○ = 3", why:"5+3=8，5−3=2。也可以试：4 和 4 加起来是 8，但要差 2，就得一个加 1、一个减 1。",
    svg:'<svg viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><path d="M60 29 L82 68 L37 68 Z" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="105" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><circle cx="150" cy="55" r="22" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="195" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">=</text><text x="230" y="66" font-size="30" text-anchor="middle" fill="#C25A3A" font-weight="700" font-family="inherit">8</text></svg>' },

{ lv:2, tag:"周期", q:"把珠子按“红、黄、蓝、红、黄、蓝……”\n的顺序一颗一颗串起来。\n第 10 颗是什么颜色？",
    hint:"3 颗一组，第 9 颗刚好是第几组的最后一颗？",
    a:"红色", why:"每 3 颗一组，9 颗正好 3 组，第 10 颗就是第 4 组的第 1 颗，是红色。周期问题先找“几个一组”。" },

{ lv:3, tag:"图形算式", q:"□ + ○ = 9，□ − ○ = 1。□ 和 ○ 各是几？",
    hint:"两个数相差 1，加起来 9，就是挨着的两个数。",
    a:"□ = 5，○ = 4", why:"5+4=9，5−4=1。9 分成两个相邻的数，只能是 4 和 5。",
    svg:'<svg viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><rect x="38" y="33" width="44" height="44" rx="3" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="105" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><circle cx="150" cy="55" r="22" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="195" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">=</text><text x="230" y="66" font-size="30" text-anchor="middle" fill="#C25A3A" font-weight="700" font-family="inherit">9</text></svg>' },

{ lv:3, tag:"鸡兔同笼 · 枚举", q:"笼子里有鸡和兔共 5 只，\n一共有 14 条腿。\n鸡有几只？兔有几只？",
    hint:"一只鸡 2 条腿，一只兔 4 条腿。一个一个试：1 只兔呢？2 只兔呢？",
    a:"兔 2 只，鸡 3 只", why:"假设全是鸡：5×2=10 条腿，比 14 少 4 条。每把一只鸡换成兔，多 2 条腿，所以要换 2 只：兔 2 只、鸡 3 只。一年级用枚举或画图都行。" },

{ lv:2, tag:"等量代换", q:"1 个苹果换 2 个橘子，1 个橘子换 3 颗糖。1 个苹果能换几颗糖？",
    hint:"先换成橘子，再把每个橘子换成糖。",
    a:"6 颗", why:"2 个橘子，每个值 3 颗糖：3+3=6。",
    svg:'<svg viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><circle cx="70" cy="60" r="22" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="115" y="70" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">=</text><circle cx="155" cy="60" r="16" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><circle cx="190" cy="60" r="16" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="240" y="70" font-size="16" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">每个</text><text x="240" y="95" font-size="16" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">换3颗糖</text></svg>' },

{ lv:2, tag:"多余条件", q:"小明有 5 个红球、3 个蓝球。\n送给小红 2 个红球。\n还剩几个红球？",
    hint:"题目里有一个数根本用不上，是哪个？",
    a:"3 个", why:"5-2=3。蓝球的 3 个是干扰条件，完全用不上。读题时先问一句“问的是什么颜色”，能避开很多坑。" },

{ lv:3, tag:"天平 · 代换", q:"天平平衡：2 个方块 = 1 个圆，3 个圆 = 1 个三角。1 个三角等于几个方块？",
    hint:"一层一层换：先算 1 个三角值几个圆。",
    a:"6 个方块", why:"3 个圆，每个圆值 2 个方块：2+2+2=6。",
    svg:'<svg viewBox="0 0 360 120" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><rect x="42" y="42" width="35" height="35" rx="3" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><rect x="102" y="42" width="35" height="35" rx="3" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="175" y="70" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">=</text><circle cx="225" cy="60" r="20" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="285" y="70" font-size="16" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">= 3 个</text></svg>' },

{ lv:3, tag:"排列 · 有序思考", q:"用 1、2、3 三张数字卡片，\n能摆出多少个不同的两位数？\n其中最大的是几？",
    hint:"先固定十位是 1，能摆几个？再试 2 和 3。",
    a:"6 个，最大 32", why:"十位是 1：12、13；十位是 2：21、23；十位是 3：31、32。有序地摆，一个不漏。最大的是 32。" },

{ lv:2, tag:"数图形 · 线段", q:"一条直线上有 4 个点。以这些点为端点，一共能数出几条线段？",
    hint:"先数相邻的，再数隔一个的，最后数隔两个的。",
    a:"6 条", why:"3+2+1=6：相邻 3 条、隔一个 2 条、隔两个 1 条。",
    svg:'<svg viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><line x1="60" y1="70" x2="300" y2="70" stroke="#3B322B" stroke-width="2.4"/><circle cx="60" cy="70" r="6" fill="#C25A3A"/><circle cx="140" cy="70" r="6" fill="#C25A3A"/><circle cx="220" cy="70" r="6" fill="#C25A3A"/><circle cx="300" cy="70" r="6" fill="#C25A3A"/></svg>' },

{ lv:3, tag:"对折", q:"一根绳子对折两次后，\n量得长 3 米。\n这根绳子原来长几米？",
    hint:"对折一次变几层？对折两次呢？",
    a:"12 米", why:"对折一次是 2 层，两次是 4 层。展开就是 4 个 3 米：3×4=12 米。这类题一定要先想“层数”。" },

{ lv:3, tag:"数图形 · 线段", q:"一条直线上有 5 个点。以这些点为端点，一共能数出几条线段？",
    hint:"按“隔几个点”分类数，别跳着数。",
    a:"10 条", why:"4+3+2+1=10。",
    svg:'<svg viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><line x1="40" y1="70" x2="320" y2="70" stroke="#3B322B" stroke-width="2.4"/><circle cx="40" cy="70" r="6" fill="#C25A3A"/><circle cx="110" cy="70" r="6" fill="#C25A3A"/><circle cx="180" cy="70" r="6" fill="#C25A3A"/><circle cx="250" cy="70" r="6" fill="#C25A3A"/><circle cx="320" cy="70" r="6" fill="#C25A3A"/></svg>' },

{ lv:3, tag:"周期 · 星期", q:"今天是星期四。\n再过 10 天是星期几？",
    hint:"7 天一个循环。先看 10 天里有几个 7 天，还剩几天。",
    a:"星期日", why:"10 = 7 + 3。过 7 天还是星期四，再过 3 天就是星期五、星期六、星期日。" },

{ lv:3, tag:"数图形 · 三角形", q:"下图里一共有多少个三角形？",
    hint:"小的数完，再数两个小的拼成的大三角形。",
    a:"8 个", why:"4 个小的 + 4 个大的（两条边 + 一条对角线）= 8。",
    svg:'<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><rect x="70" y="30" width="160" height="160" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.4"/><path d="M70 30 L230 190 M230 30 L70 190" stroke="#3B322B" stroke-width="2.4" fill="none"/></svg>' },

{ lv:3, tag:"小棒 · 分享边", q:"用 10 根同样长的小棒，\n能摆出 3 个正方形吗？",
    hint:"3 个正方形排成一排，有几条边是共用的？",
    a:"能", why:"分开摆要 4×3=12 根。排成一排，相邻两个共用一条边，省下 2 根，正好 10 根。让孩子动手摆一摆最有说服力。" },

{ lv:2, tag:"数图形 · 三角形", q:"一个三角形，从顶点向底边画一条线，把它分成两个小三角形。图里一共有几个三角形？",
    hint:"除了两个小的，还有原来那个大的。",
    a:"3 个", why:"2 个小的 + 1 个大的 = 3 个。",
    svg:'<svg viewBox="0 0 300 220" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><path d="M150 30 L40 180 L260 180 Z" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.4"/><line x1="150" y1="30" x2="150" y2="180" stroke="#3B322B" stroke-width="2.4"/></svg>' },

{ lv:3, tag:"等式 · 有序分组", q:"把 1、2、3、4 填进\n□ + □ = □ + □，\n使等式成立。\n该怎么填？",
    hint:"两边要一样大。试试把最大的和最小的放在一起。",
    a:"1+4 = 2+3", why:"1+4=5，2+3=5。秘诀是“大配小”：最大的配最小的，剩下的两个配一起，这样两边才相等。" },

{ lv:2, tag:"数图形 · 正方形", q:"下图里一共有多少个正方形？",
    hint:"小的 4 个，还有一个大的。",
    a:"5 个", why:"4 个小正方形 + 1 个大正方形 = 5 个。",
    svg:'<svg viewBox="0 0 300 240" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><rect x="70" y="35" width="160" height="160" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.4"/><line x1="150" y1="35" x2="150" y2="195" stroke="#3B322B" stroke-width="2.4"/><line x1="70" y1="115" x2="230" y2="115" stroke="#3B322B" stroke-width="2.4"/></svg>' },

{ lv:3, tag:"排队 · 夹在中间", q:"12 个小朋友排队。\n小明从前数第 5，\n小红从后数第 4。\n小明和小红之间有几人？",
    hint:"先算小红从前面数是第几。",
    a:"3 人", why:"小红从前数是 12-4+1=9。小明第 5、小红第 9，中间的 6、7、8 号就是 3 人。也可以 12-5-4=3。" },

{ lv:3, tag:"数阵 · 三角形", q:"把 1、2、3、4、5、6 分别填进圆圈，使三角形每条边上三个数的和都相等。每条边的和最小是几？",
    hint:"先把最小的三个数放在三个顶点试试。",
    a:"9", why:"三个顶点放 1、2、3，边上放 6、4、5，每条边都是 9。顶点和越小，每边的和就越小：1+2+3=6，(21+6)÷3=9。",
    svg:'<svg viewBox="0 0 340 280" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><path d="M170 40 L60 220 L280 220 Z" fill="none" stroke="#3B322B" stroke-width="2" opacity=".5"/><circle cx="170" cy="40" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><circle cx="60" cy="220" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><circle cx="280" cy="220" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><circle cx="115" cy="130" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><circle cx="225" cy="130" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><circle cx="170" cy="220" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><text x="170" y="262" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">1 ~ 6 各用一次</text></svg>' },

{ lv:3, tag:"逆向 · 凑数", q:"□ + □ = 9，\n两个加数相差 1。\n这两个数是几和几？",
    hint:"两个数差不多大，先想 9 的一半是多少。",
    a:"4 和 5", why:"9 分成两个差不多的数，就是 4 和 5，相差正好 1。也可以试：4+5=9，5-4=1，两个条件都满足。" },

{ lv:3, tag:"数阵 · 十字", q:"把 1、2、3、4、5 填进五个圆圈，使横着三个数、竖着三个数相加都等于 9。中间填几？",
    hint:"五个数的总和是 15，横竖各算一次是 18，多出来的 3 是哪来的？",
    a:"中间填 3", why:"1+2+3+4+5=15，9+9=18，多出的 3 正是中间那个数（它被数了两遍）。",
    svg:'<svg viewBox="0 0 360 250" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><g fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"><circle cx="180" cy="50" r="21"/><circle cx="180" cy="120" r="21"/><circle cx="110" cy="120" r="21"/><circle cx="250" cy="120" r="21"/><circle cx="180" cy="190" r="21"/></g><text x="180" y="235" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">横竖都要等于 9</text></svg>' },

{ lv:3, tag:"综合 · 楼梯进阶", q:"小明从 1 楼走到 4 楼用了 3 分钟。\n照这样的速度，\n他从 1 楼走到 7 楼要几分钟？",
    hint:"先算每层用几分钟，再数 1 楼到 7 楼有几层。",
    a:"6 分钟", why:"1 到 4 楼走 3 层，用 3 分钟，每层 1 分钟。1 到 7 楼走 6 层，所以 6 分钟。这类题永远先算“层数”。" },

{ lv:3, tag:"幻方 · 九宫格", q:"把 1~9 填进九宫格，使每行、每列、每条对角线三个数相加都等于 15。中间那格填几？",
    hint:"1 到 9 一共 45，平均分给三行，每行就是 15。",
    a:"中间填 5", why:"1~9 的总和是 45，三行平均每行 15。中间的数在四条线上各算一次，只有 5 能胜任。一组填法：8 1 6 / 3 5 7 / 4 9 2。",
    svg:'<svg viewBox="0 0 360 250" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><g stroke="#3B322B" stroke-width="2" fill="#FDFAF2"><rect x="80" y="40" width="52" height="52" fill="#FDFAF2"/><rect x="132" y="40" width="52" height="52" fill="#FDFAF2"/><rect x="184" y="40" width="52" height="52" fill="#FDFAF2"/><rect x="80" y="92" width="52" height="52" fill="#FDFAF2"/><rect x="132" y="92" width="52" height="52" fill="#FFF0E6"/><rect x="184" y="92" width="52" height="52" fill="#FDFAF2"/><rect x="80" y="144" width="52" height="52" fill="#FDFAF2"/><rect x="132" y="144" width="52" height="52" fill="#FDFAF2"/><rect x="184" y="144" width="52" height="52" fill="#FDFAF2"/></g><text x="218" y="235" font-size="13" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">每行、每列、每条对角线都是 15</text></svg>' },

{ lv:3, hard:true, tag:"计数 · 路线", q:"从家到学校有 2 条路，\n从学校到公园有 3 条路。\n从家经过学校到公园，\n一共有几种走法？",
    hint:"把 2 条路叫甲、乙，3 条路叫 1、2、3，一条一条列出来。",
    a:"6 种", why:"甲1、甲2、甲3、乙1、乙2、乙3，一共 6 种。这是乘法原理的雏形，一年级用“列举”做，不用背公式。" },

{ lv:2, tag:"找规律 · 周期", q:"图形按 △、○、□、△、○、□…… 的顺序排下去。第 11 个是什么图形？",
    hint:"3 个一组，先数到第 9 个是几组？",
    a:"○", why:"3 个一组，第 9 个是第 3 组的最后一个（□）；第 10 个是 △，第 11 个是 ○。",
    svg:'<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><path d="M60 60 L82 96 L38 96 Z" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><circle cx="140" cy="78" r="22" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><rect x="196" y="56" width="44" height="44" rx="3" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><path d="M280 60 L302 96 L258 96 Z" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="320" y="86" font-size="22" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">…</text><text x="175" y="140" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">每 3 个一组</text></svg>' },

{ lv:3, hard:true, tag:"等量代换 · 三级", q:"1 个西瓜换 2 个菠萝，\n1 个菠萝换 3 个苹果，\n1 个苹果换 2 个桃子。\n1 个西瓜能换几个桃子？",
    hint:"一层一层换：先把西瓜换成菠萝，再把菠萝换成苹果，最后换成桃子。",
    a:"12 个", why:"1 个菠萝 = 3 个苹果 = 6 个桃子；西瓜 = 2 个菠萝 = 12 个桃子。每换一层，数量就乘一次。" },

{ lv:2, tag:"找规律 · 周期", q:"按 “●、●、○” 三个一组重复排列。第 10 个是什么？",
    hint:"第 9 个刚好是第 3 组的最后一个。",
    a:"●", why:"3 个一组，第 9 个是最后一个 ○；第 10 个又从 ● 开始。",
    svg:'<svg viewBox="0 0 360 150" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><text x="50" y="80" font-size="30" text-anchor="middle" fill="#C25A3A" font-weight="400" font-family="inherit">●</text><text x="82" y="80" font-size="30" text-anchor="middle" fill="#C25A3A" font-weight="400" font-family="inherit">●</text><text x="114" y="80" font-size="30" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">○</text><text x="146" y="80" font-size="30" text-anchor="middle" fill="#C25A3A" font-weight="400" font-family="inherit">●</text><text x="178" y="80" font-size="30" text-anchor="middle" fill="#C25A3A" font-weight="400" font-family="inherit">●</text><text x="210" y="80" font-size="30" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">○</text><text x="242" y="80" font-size="30" text-anchor="middle" fill="#C25A3A" font-weight="400" font-family="inherit">●</text><text x="274" y="80" font-size="30" text-anchor="middle" fill="#C25A3A" font-weight="400" font-family="inherit">●</text><text x="306" y="80" font-size="30" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">○</text><text x="180" y="130" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">红红黄，红红黄……</text></svg>' },

{ lv:3, hard:true, tag:"数字谜", q:"□ + △ = 9\n□ - △ = 1\n□ 和 △ 各是几？",
    hint:"两个数相加是 9、相差是 1，它们应该挨得很近。",
    a:"□ = 5，△ = 4", why:"5+4=9，5-4=1。也可以想：把 9 分成两个相邻的数，就是 4 和 5。" },

{ lv:2, tag:"小棒 · 分享边", q:"摆 2 个正方形，最少要用几根同样长的小棒？",
    hint:"两个正方形能不能共用一条边？",
    a:"7 根", why:"分开摆要 8 根；让它们共用一条边，就省下 1 根，只要 7 根。",
    svg:'<svg viewBox="0 0 330 190" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><g fill="none" stroke="#3B322B" stroke-width="3"><rect x="70" y="40" width="80" height="80"/><rect x="150" y="40" width="80" height="80"/></g><text x="150" y="165" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">两个正方形共用一条边</text></svg>' },

{ lv:3, hard:true, tag:"鸡兔同笼 · 进阶", q:"笼子里有鸡和兔共 8 只，\n一共 22 条腿。\n鸡、兔各有几只？",
    hint:"假设 8 只全是鸡，会有几条腿？比 22 少几条？",
    a:"兔 3 只，鸡 5 只", why:"全当鸡：8×2=16 条腿，少了 6 条。每把 1 只鸡换成兔，多 2 条腿，所以要换 3 只。兔 3、鸡 5。" },

{ lv:3, tag:"开放题 · 剪角", q:"一个正方形，剪掉一个角以后，还剩几个角？",
    hint:"剪的位置不同，结果不一样，多试几种。",
    a:"可能是 3 个、4 个或 5 个", why:"沿对角线剪：剩 3 个角；从一个顶点剪到对边：剩 4 个；只剪掉角上一小块：剩 5 个。三种都对。",
    svg:'<svg viewBox="0 0 330 245" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><rect x="70" y="30" width="160" height="160" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.4"/><path d="M70 30 L120 30 L70 80 Z" fill="#FFF0E6" stroke="#C25A3A" stroke-width="2" stroke-dasharray="6 4"/><text x="150" y="225" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">虚线是剪的位置</text></svg>' },

{ lv:3, hard:true, tag:"还原 · 一半多一", q:"一筐苹果，\n第一次卖出全部的一半多 1 个，\n第二次卖出剩下的一半多 1 个，\n最后还剩 1 个。\n原来有多少个？",
    hint:"倒着推：第二次卖之前有几个？先加回多卖的 1 个，再乘 2。",
    a:"10 个", why:"倒推：(1+1)×2=4 个（第二次卖之前）；(4+1)×2=10 个（第一次卖之前）。“一半多1”倒推时就是“先加1，再乘2”。" },

{ lv:3, tag:"小棒 · 开放题", q:"用 6 根同样长的小棒，最多能摆出几个一样大的三角形？",
    hint:"在桌面上只能摆 2 个。试试搭起来，离开桌面呢？",
    a:"4 个（搭成立体的）", why:"平面上 6 根只能摆 2 个三角形。把 3 根摆成底面三角形、另外 3 根从三个顶点收成一个尖，就是三棱锥，有 4 个面。",
    svg:'<svg viewBox="0 0 330 245" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><path d="M150 30 L60 180 L240 180 Z" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.4"/><path d="M150 30 L150 180 M60 180 L150 180 M240 180 L150 180" stroke="#C25A3A" stroke-width="1.6" stroke-dasharray="5 4"/><text x="150" y="222" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">6 根小棒，能摆几个三角形？</text></svg>' },

{ lv:3, hard:true, tag:"数阵 · 十字", q:"把 1、2、3、4、5 填进十字形，\n使横着三个数、竖着三个数\n相加都等于 9。\n中间填几？",
    hint:"五个数加起来是 15，横竖各算一次是 18，多出来的 3 是哪来的？",
    a:"中间填 3", why:"1+2+3+4+5=15，横竖两条线一共 9+9=18，多出的 3 正是中间那个数（它被数了两遍）。横填 2、4，竖填 1、5。" },

{ lv:2, tag:"等量代换", q:"1 个西瓜换 3 个菠萝，1 个菠萝换 2 个苹果。1 个西瓜能换几个苹果？",
    hint:"先把西瓜换成菠萝，再把每个菠萝换成苹果。",
    a:"6 个", why:"3 个菠萝，每个值 2 个苹果：2+2+2=6。",
    svg:'<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><text x="90" y="80" font-size="40" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">🍉</text><text x="150" y="80" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">=</text><text x="205" y="80" font-size="30" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">🍍🍍🍍</text><text x="160" y="130" font-size="15" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">1 个菠萝 = 2 个苹果</text></svg>' },

{ lv:3, hard:true, tag:"周期 · 跨年", q:"12 月 20 日是星期五。\n明年 1 月 1 日是星期几？",
    hint:"先算从 12 月 20 日到 1 月 1 日有几天（12 月有 31 天）。",
    a:"星期三", why:"20 日到 31 日是 11 天，再过 1 天就是 1 月 1 日，共 12 天。12÷7 余 5，从星期五往后数 5 天：六、日、一、二、三。" },

{ lv:2, tag:"图形算式", q:"三个 ○ 相加等于 9。○ + □ = 7。□ 代表几？",
    hint:"先算一个 ○ 是几。",
    a:"□ = 4", why:"9 分成三个一样的数：3+3+3=9，所以 ○ 是 3；3+□=7，□=4。",
    svg:'<svg viewBox="0 0 360 160" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><text x="60" y="70" font-size="30" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">○</text><text x="105" y="70" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><text x="150" y="70" font-size="30" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">○</text><text x="195" y="70" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><text x="240" y="70" font-size="30" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">○</text><text x="285" y="70" font-size="26" text-anchor="middle" fill="#C25A3A" font-weight="700" font-family="inherit">=9</text><text x="180" y="130" font-size="22" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">○ + □ = 7</text></svg>' },

{ lv:3, hard:true, tag:"幻方 · 九宫格", q:"把 1~9 填进九宫格，\n使每行、每列、每条对角线\n三个数相加都等于 15。\n中间那格填几？",
    hint:"1 到 9 一共 45，平均分给三行，每行就是 15。中间那个数最特殊。",
    a:"中间填 5", why:"1~9 的总和是 45，三行平均每行 15。中间的数要在四条线上各算一次，只有 5 能胜任。填法：8 1 6 / 3 5 7 / 4 9 2。" },

{ lv:2, tag:"数图形 · 长方形", q:"一个长方形，从中间竖着画一条线，分成两个小长方形。图里一共有几个长方形？",
    hint:"两个小的，加上原来那个大的。",
    a:"3 个", why:"2 个小长方形 + 1 个大长方形 = 3 个。",
    svg:'<svg viewBox="0 0 340 200" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><rect x="60" y="40" width="200" height="100" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.4"/><line x1="160" y1="40" x2="160" y2="140" stroke="#3B322B" stroke-width="2.4"/><text x="160" y="180" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">小的数完，再数大的</text></svg>' },

{ lv:3, hard:true, tag:"还原 · 剪绳", q:"一根绳子，\n第一次剪去一半，\n第二次剪去剩下的一半，\n还剩 2 米。\n原来有几米？",
    hint:"倒着推：剩 2 米，剪之前是几米？",
    a:"8 米", why:"2×2=4（第二次剪之前），4×2=8（原来）。每剪一次一半，倒推就乘一次 2。" },

{ lv:3, tag:"数图形 · 三角形", q:"从一个三角形的顶点向底边画两条线，把它分成三个小三角形。图里一共有几个三角形？",
    hint:"先数单个的，再数两个拼起来的，最后数三个拼起来的。",
    a:"6 个", why:"3 个小的 + 2 个两个拼成的 + 1 个三个拼成的 = 3+2+1 = 6 个。",
    svg:'<svg viewBox="0 0 340 250" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><path d="M170 30 L50 190 L290 190 Z" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.4"/><path d="M170 30 L130 190 M170 30 L210 190" stroke="#3B322B" stroke-width="2.4"/><text x="170" y="232" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">一共几个三角形？</text></svg>' },

  { lv:2, tag:"间隔 · 楼梯", q:"小明从 1 楼走到 5 楼用了 4 分钟。\n照这样，从 1 楼走到 6 楼要几分钟？",
    hint:"1 到 5 楼走了几层？",
    a:"5 分钟", why:"1 楼到 5 楼是 4 层，4 分钟就是每层 1 分钟。1 楼到 6 楼是 5 层，需要 5 分钟。楼梯题的固定陷阱：楼层数永远比楼梯层数多 1。" },

  { lv:1, tag:"图形算式", q:"两个 △ 加起来等于 6。△ 代表几？",
    hint:"几加几等于 6，两个数要一样。",
    a:"△ = 3", why:"3 + 3 = 6，所以 △ 代表 3。同样的图形表示同样的数。",
    svg:'<svg viewBox="0 0 320 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><path d="M70 29 L92 68 L47 68 Z" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="112" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><path d="M154 29 L176 68 L131 68 Z" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="196" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">=</text><text x="232" y="66" font-size="30" text-anchor="middle" fill="#C25A3A" font-weight="700" font-family="inherit">6</text></svg>' },

  { lv:2, tag:"间隔 · 锯木头", q:"一根木头锯成 6 段，每锯一次要 2 分钟。\n一共要几分钟？",
    hint:"锯成 6 段要锯几次？",
    a:"10 分钟", why:"锯 6 段要锯 5 次（次数 = 段数 − 1），5 × 2 = 10 分钟。和锯 4 段那题同一个道理，只是数字变大。" },

  { lv:2, tag:"图形算式", q:"两个 ○ 加起来是 10。○ + □ = 8。\n○ 和 □ 各是几？",
    hint:"先算一个 ○。",
    a:"○ = 5，□ = 3", why:"5 + 5 = 10，所以 ○ 是 5；5 + □ = 8，所以 □ 是 3。",
    svg:'<svg viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><circle cx="60" cy="55" r="22" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="100" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><circle cx="140" cy="55" r="22" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="182" y="66" font-size="24" text-anchor="middle" fill="#C25A3A" font-weight="700" font-family="inherit">=10</text></svg>' },

  { lv:2, tag:"排队 · 两端计数", q:"一队小朋友，小明从左数排第 3，从右数排第 5。\n这一队一共有多少人？",
    hint:"小明被数了两次，要减掉 1。",
    a:"7 人", why:"左边 3 人（含小明），右边 5 人（含小明），小明被算了两遍，所以 3 + 5 − 1 = 7 人。" },

  { lv:1, tag:"图形算式", q:"三个 □ 加起来等于 9。□ 代表几？",
    hint:"把 9 分成三个一样的数。",
    a:"□ = 3", why:"3 + 3 + 3 = 9，所以 □ 是 3。",
    svg:'<svg viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><rect x="28" y="33" width="44" height="44" rx="3" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="95" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><rect x="118" y="33" width="44" height="44" rx="3" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="185" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><rect x="208" y="33" width="44" height="44" rx="3" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="280" y="66" font-size="24" text-anchor="middle" fill="#C25A3A" font-weight="700" font-family="inherit">=9</text></svg>' },

  { lv:3, tag:"排队 · 夹在中间", q:"12 个小朋友排队，小明从前数第 4，小红排在最后。\n小明和小红之间有几人？",
    hint:"先算小明后面有几人，再去掉小红自己。",
    a:"7 人", why:"小明后面还有 12 − 4 = 8 人，其中最后一个是小红，中间的就有 8 − 1 = 7 人。" },

  { lv:3, tag:"图形算式", q:"△ + ○ = 7，△ − ○ = 1。\n△ 和 ○ 各是几？",
    hint:"两个数加起来 7、相差 1，是挨着的两个数。",
    a:"△ = 4，○ = 3", why:"4 + 3 = 7，4 − 3 = 1。7 分成两个相邻的数，就是 3 和 4。",
    svg:'<svg viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><path d="M60 29 L82 68 L37 68 Z" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="105" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">+</text><circle cx="150" cy="55" r="22" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="195" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">=</text><text x="232" y="66" font-size="30" text-anchor="middle" fill="#C25A3A" font-weight="700" font-family="inherit">7</text></svg>' },

  { lv:2, tag:"还原 · 倒推", q:"一个数先加上 3，再减去 5，结果是 4。\n这个数原来是多少？",
    hint:"从结果倒着做，加变减、减变加。",
    a:"6", why:"倒推：4 + 5 = 9，9 − 3 = 6。验算：6 + 3 − 5 = 4 ✓。倒推时两个动作都要反过来，顺序也要倒过来。" },

  { lv:2, tag:"等量代换", q:"1 个西瓜换 2 个菠萝，1 个菠萝换 2 个苹果。\n1 个西瓜能换几个苹果？",
    hint:"先把西瓜换成菠萝，再把菠萝换成苹果。",
    a:"4 个", why:"2 个菠萝，每个换 2 个苹果：2 × 2 = 4 个。",
    svg:'<svg viewBox="0 0 360 130" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><circle cx="80" cy="55" r="26" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="140" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">=</text><circle cx="200" cy="55" r="16" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><circle cx="240" cy="55" r="16" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="180" y="112" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">1 个菠萝 = 2 个苹果</text></svg>' },

  { lv:2, tag:"还原 · 一半", q:"妈妈买了一些糖，吃掉一半以后还剩 6 颗。\n原来有多少颗？",
    hint:"剩下 6 颗，是全部还是一半？",
    a:"12 颗", why:"剩下的是原来的一半，所以原来 6 × 2 = 12 颗。验算：12 的一半是 6，吃完正好剩 6 ✓。" },

  { lv:2, tag:"等量代换 · 天平", q:"天平平衡：1 个苹果 = 3 颗糖。\n2 个苹果 = 几颗糖？",
    hint:"一个苹果 3 颗，两个就是两个 3。",
    a:"6 颗", why:"3 + 3 = 6 颗。",
    svg:'<svg viewBox="0 0 360 130" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><circle cx="80" cy="55" r="24" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.6"/><text x="140" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">=</text><text x="215" y="66" font-size="26" text-anchor="middle" fill="#3B322B" font-weight="400" font-family="inherit">🍬🍬🍬</text><text x="180" y="112" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">2 个苹果 = 6 颗糖</text></svg>' },

  { lv:1, tag:"鸡兔同笼 · 入门", q:"笼子里有 2 只鸡和 1 只兔。\n一共有多少条腿？",
    hint:"鸡 2 条腿，兔 4 条腿。",
    a:"8 条", why:"2 只鸡：2 × 2 = 4 条；1 只兔：4 条。一共 4 + 4 = 8 条。先分清两种动物的腿数，是鸡兔同笼的第一步。" },

  { lv:1, tag:"数图形 · 线段", q:"一条直线上有 3 个点。以这些点为端点，\n一共能数出几条线段？",
    hint:"相邻的两段，加上整体那一段。",
    a:"3 条", why:"左边一段、右边一段、整体一段，共 3 条。3 个点两两配成 3 对，所以 3 条。",
    svg:'<svg viewBox="0 0 360 110" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><line x1="70" y1="70" x2="290" y2="70" stroke="#3B322B" stroke-width="2.4"/><circle cx="70" cy="70" r="6" fill="#C25A3A"/><circle cx="180" cy="70" r="6" fill="#C25A3A"/><circle cx="290" cy="70" r="6" fill="#C25A3A"/></svg>' },

  { lv:2, tag:"年龄 · 差不变", q:"哥哥今年 9 岁，弟弟 6 岁。\n3 年以后，哥哥比弟弟大几岁？",
    hint:"两个人一起长大，差会变吗？",
    a:"3 岁", why:"今年差 9 − 6 = 3 岁。3 年后两人都长 3 岁，差还是 3 岁。年龄差永远不变。" },

  { lv:1, tag:"数图形 · 三角形", q:"一个正方形，沿对角线剪开。\n能得到几个三角形？",
    hint:"沿对角线一刀，正好分成两半。",
    a:"2 个三角形", why:"一条对角线把正方形分成 2 个完全一样的三角形。",
    svg:'<svg viewBox="0 0 300 230" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><rect x="80" y="35" width="150" height="150" fill="#FDFAF2" stroke="#3B322B" stroke-width="2.4"/><line x1="80" y1="35" x2="230" y2="185" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="7 5"/></svg>' },

  { lv:2, tag:"排列 · 有序思考", q:"用数字卡片 1 和 2，能摆出几个不同的两位数？",
    hint:"十位和个位交换，算不算同一个？",
    a:"2 个：12 和 21", why:"1 放十位得 12，2 放十位得 21，共 2 个。摆数题按“谁在十位”分类，就不会漏。" },

  { lv:3, tag:"数图形 · 正方形", q:"下图是一个 3×3 的方格。\n一共有多少个正方形？",
    hint:"小的数完，再数 2×2 的，最后数整体。",
    a:"14 个", why:"1×1 的 9 个 + 2×2 的 4 个 + 3×3 的 1 个 = 14 个。按大小分类数，才不会漏。",
    svg:'<svg viewBox="0 0 300 260" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><g stroke="#3B322B" stroke-width="2" fill="#FDFAF2"><rect x="75" y="30" width="150" height="150"/><line x1="125" y1="30" x2="125" y2="180"/><line x1="175" y1="30" x2="175" y2="180"/><line x1="75" y1="80" x2="225" y2="80"/><line x1="75" y1="130" x2="225" y2="130"/></g></svg>' },

  { lv:3, tag:"分与合 · 有序", q:"把 5 分成两个数相加，有几种分法？\n（两个数都大于 0，顺序不同算不同）",
    hint:"从小数开始，一对一对地写。",
    a:"4 种：1+4、2+3、3+2、4+1", why:"按第一个数从 1 数到 4：1+4、2+3、3+2、4+1，共 4 种。有序地写，才不会漏也不会重。" },

  { lv:3, tag:"数图形 · 长方形", q:"下图是一个 2×2 的方格。\n一共有多少个长方形？",
    hint:"单个的 4 个，两个拼的，四个拼的。",
    a:"9 个", why:"单个 4 个 + 竖着两个拼 2 个 + 横着两个拼 2 个 + 四个拼成的大的 1 个 = 9 个。",
    svg:'<svg viewBox="0 0 300 250" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><g stroke="#3B322B" stroke-width="2" fill="#FDFAF2"><rect x="85" y="35" width="140" height="140"/><line x1="155" y1="35" x2="155" y2="175"/><line x1="85" y1="105" x2="225" y2="105"/></g></svg>' },

  { lv:1, tag:"找规律 · 等差", q:"2、4、6、8、（  ）",
    hint:"每次都多几？",
    a:"10", why:"相邻两个数都差 2，8 + 2 = 10。看“差”就能找到规律。" },

  { lv:2, tag:"数图形 · 角", q:"一个直角里画一条线，把它分成两个小角。\n一共有几个角？",
    hint:"两个小的，加上原来那个大的。",
    a:"3 个", why:"2 个小角 + 1 个大角（两个小角合起来）= 3 个角。",
    svg:'<svg viewBox="0 0 300 230" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><path d="M90 180 L90 60 M90 180 L230 180" stroke="#3B322B" stroke-width="2.6" fill="none"/><line x1="90" y1="180" x2="200" y2="90" stroke="#C25A3A" stroke-width="2.4"/></svg>' },

  { lv:1, tag:"找规律 · 等差", q:"1、3、5、7、（  ）",
    hint:"每次多 2，都是单数。",
    a:"9", why:"相邻两数差 2，7 + 2 = 9。这是奇数数列。" },

  { lv:3, tag:"数阵 · 十字", q:"把 1、2、3、4、5 填进五个圆圈，\n使横着三个数、竖着三个数相加都等于 10。\n中间填几？",
    hint:"五个数的和是 15，横竖各算一次是 20，多出来的是谁？",
    a:"中间填 5", why:"1+2+3+4+5 = 15，10 + 10 = 20，多出的 5 正是中间那个数（它被数了两遍）。剩下 1 和 4、2 和 3 配对，每对都是 5。",
    svg:'<svg viewBox="0 0 360 250" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><g fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"><circle cx="180" cy="50" r="21"/><circle cx="180" cy="120" r="21"/><circle cx="110" cy="120" r="21"/><circle cx="250" cy="120" r="21"/><circle cx="180" cy="190" r="21"/></g><text x="180" y="235" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">横、竖都要等于 10</text></svg>' },

  { lv:1, tag:"找规律 · 递减", q:"10、9、8、（  ）、（  ）",
    hint:"每次少 1。",
    a:"7、6", why:"相邻两数都少 1：8 − 1 = 7，7 − 1 = 6。" },

  { lv:3, tag:"数阵 · 三角形", q:"把 1、2、3、4、5、6 分别填进圆圈，\n使三角形每条边上三个数的和都是 10。\n怎么填？",
    hint:"三条边的和合计 30，六个数的和只有 21，多出的 9 是谁贡献的？",
    a:"顶点填 1、3、5，边中点填 6、2、4（每边都是 10）", why:"三条边相加，每个顶点被算了两次，所以 30 − 21 = 9 就是三个顶点的和。1+3+5 = 9，正好。填法：1 和 3 之间填 6（1+6+3=10）；3 和 5 之间填 2（3+2+5=10）；5 和 1 之间填 4（5+4+1=10）。旋转一下也算对。",
    svg:'<svg viewBox="0 0 340 285" xmlns="http://www.w3.org/2000/svg" style="max-width:330px;display:block;margin:8px auto"><path d="M170 40 L60 220 L280 220 Z" fill="none" stroke="#3B322B" stroke-width="2" opacity=".5"/><circle cx="170" cy="40" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><circle cx="60" cy="220" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><circle cx="280" cy="220" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><circle cx="115" cy="130" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><circle cx="225" cy="130" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><circle cx="170" cy="220" r="21" fill="#FDFAF2" stroke="#C25A3A" stroke-width="2.4" stroke-dasharray="6 5"/><text x="170" y="268" font-size="14" text-anchor="middle" fill="#8A7B68" font-weight="400" font-family="inherit">1 ~ 6 各用一次</text></svg>' },

  { lv:2, tag:"周期 · 颜色", q:"把珠子按“红、黄、蓝、红、黄、蓝……”串起来。\n第 8 颗是什么颜色？",
    hint:"3 颗一组，第 8 颗在第几组第几个？",
    a:"黄色", why:"3 颗一组：第 6 颗是蓝，第 7 颗是红，第 8 颗是黄。也可以 8 ÷ 3 = 2 余 2，余数 2 取每组第 2 个。" },

  { lv:1, tag:"图形算式", q:"三个 ○ 加起来等于 12。○ 代表几？",
    hint:"把 12 分成三个一样的数。",

/* ---------------- 日期与索引 ---------------- */
function ymd(d){ return d.getFullYear()+" 年 "+(d.getMonth()+1)+" 月 "+d.getDate()+" 日"; }
function isWeekend(d){ var w=d.getDay(); return w===0||w===6; }

// 从 START 到 today（含）之间，有多少个工作日
function schoolDayIndex(today){
  var a = new Date(START.getFullYear(), START.getMonth(), START.getDate());
  var b = new Date(today.getFullYear(), today.getMonth(), today.getDate());
  if (b < a) return 0;
  var n = 0, d = new Date(a);
  while (d <= b) {
    if (!isWeekend(d)) n++;
    d.setDate(d.getDate()+1);
  }
  return Math.max(0, n-1);
}

// 第 index 个工作日的具体日期
function dateOfIndex(index){
  var d = new Date(START), n = 0;
  while (true) {
    if (!isWeekend(d)) {
      if (n === index) return new Date(d);
      n++;
    }
    d.setDate(d.getDate()+1);
  }
}

function shortDate(d){ return (d.getMonth()+1)+"/"+d.getDate(); }

      '<span class="date">' + shortDate(dk) + '</span>' +
      '</summary><div class="inner">' +
      '<span class="lbl">' + (q.hard ? '竞赛 · ' : '') + q.tag + ' · ' + st + '</span>' +
      q.q.replace(/\n/g,'<br>') +
      '<span class="lbl">提 示</span>' + q.hint +
      '<span class="lbl">答 案</span><span class="a">' + q.a + '</span>' +
      '<span class="lbl">讲 解</span>' + q.why +
      '</div></details>';
  }
  list.innerHTML = out;
  document.getElementById('all-count').textContent = QS.length;

  var btn = document.getElementById('print-all');
  if (btn) btn.onclick = function(){
    var ds = list.querySelectorAll('details');
    for (var i = 0; i < ds.length; i++) ds[i].open = true;
    window.print();
  };
})();
</script>
</body>
</html>
